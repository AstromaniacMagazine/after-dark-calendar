name: Calendar integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check calendar data and structured metadata
        run: node scripts/validate-calendar.mjs
      - name: Check forecast failure cases and ratings
        run: node scripts/test-forecast.mjs
      - name: Cross-check Sun and Moon calculations against USNO and JPL fixtures
        run: node scripts/test-astronomy.mjs
